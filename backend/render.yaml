services:
  - type: web
    name: eld-trip-planner-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn eld_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: eld_project.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: '.onrender.com'
      - key: CORS_ALLOWED_ORIGINS
        value: 'https://your-app.vercel.app'
      - key: DATABASE_URL
        fromDatabase:
          name: eld-db
          property: connectionString

databases:
  - name: eld-db
    databaseName: eld_planner
    user: eld_user
    plan: free
